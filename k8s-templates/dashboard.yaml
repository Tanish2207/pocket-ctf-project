apiVersion: v1
kind: Namespace
metadata:
  name: bluelab-common

---
# Give dashboard permission to create/delete namespaces and deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bluelab-provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bluelab-provisioner-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: bluelab-common
roleRef:
  kind: ClusterRole
  name: bluelab-provisioner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: bluelab-common
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: default
      containers:
        - name: dashboard
          image: bluelab-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

---
# NodePort — accessible from your browser on the host
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: bluelab-common
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30800
