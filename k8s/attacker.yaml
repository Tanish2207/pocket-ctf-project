apiVersion: apps/v1
kind: Deployment
metadata:
  name: attacker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attacker
  template:
    metadata:
      labels:
        app: attacker
    spec:
      containers:
        - name: attacker
          image: attacker-image:latest
          imagePullPolicy: Never
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"] # nmap/hping3 need raw sockets
